name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: AppImage
          - os: windows-latest
            target: win
            artifact: exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packaging/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packaging/desktop/package-lock.json

      - run: npm ci
      - run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: airmitra-desktop-${{ matrix.artifact }}
          path: packaging/desktop/dist/*
          if-no-files-found: error
